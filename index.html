<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Painel interno de controle de ativos de TI da GMAD Madville — cadastro, contatos, estoque, instaladores, scripts e infraestrutura."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1d" media="(prefers-color-scheme: dark)" />
    <title>Controle de Ativos de TI — GMAD Madville</title>
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('gmad_theme')
          var theme =
            saved ||
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
